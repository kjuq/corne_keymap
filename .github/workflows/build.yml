name: Build UF2

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout userspace and pinned QMK
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Check C formatting
        run: |
          mise run format
          if ! git diff --quiet; then
            echo "C sources are not clang-formatted. Run: mise run format"
            git diff
            exit 1
          fi

      - name: Test build configuration
        run: ./tests/test_build.sh

      - name: Build firmware
        run: ./build.sh --runtime docker

      - name: Verify firmware
        run: ./tests/test_build.sh firmware.uf2

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: firmware.uf2
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware
        uses: actions/download-artifact@v8
        with:
          name: firmware

      - name: Update latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest firmware.uf2 --repo "$GITHUB_REPOSITORY" \
            --title "Latest firmware" \
            --notes "Built from $GITHUB_SHA" \
            --target "$GITHUB_SHA"
